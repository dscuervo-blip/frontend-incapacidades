<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Incapacidades Médicas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="pagina-login">
    <main class="login">
        <section class="login__tarjeta">
            <header class="login__encabezado">
                <span class="marca">Corporate Solutions</span>
                <h1>Gestión de Incapacidades Médicas</h1>
                <p>Ingresa con tu usuario o correo.</p>
            </header>

            <div id="mensaje" class="mensaje" role="alert" hidden></div>

            <form id="form-login" novalidate>
                <div class="campo">
                    <label for="usuario">Usuario o correo</label>
                    <input type="text" id="usuario" name="usuario" autocomplete="username" required>
                    <small class="campo__error"></small>
                </div>

                <div class="campo">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" name="contrasena" autocomplete="current-password" required>
                    <small class="campo__error"></small>
                </div>

                <button type="submit" class="boton boton--primario boton--bloque" id="btn-ingresar">Ingresar</button>
            </form>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
