<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel | Incapacidades Médicas</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header class="barra">
        <span class="marca">Corporate Solutions</span>
        <div class="barra__usuario">
            <span id="usuario-nombre"></span>
            <span id="usuario-rol" class="etiqueta"></span>
            <button type="button" id="btn-salir" class="boton boton--secundario">Cerrar sesión</button>
        </div>
    </header>

    <main class="contenedor">
        <div id="mensaje" class="mensaje" role="alert" hidden></div>
        <section class="tarjeta">
            <h1 id="saludo">Bienvenido</h1>
            <p>Desde aquí podrás gestionar empleados, incapacidades y su seguimiento.</p>
        </section>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/sesion.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
